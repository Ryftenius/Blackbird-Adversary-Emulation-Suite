[package]
name = "bb_ok_rust_axum_ui"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "=0.8.9"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.51.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
